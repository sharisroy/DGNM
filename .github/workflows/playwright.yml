name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      worker_count:
        description: 'Number of keyword-search chunks/workers'
        required: false
        default: '20'

jobs:
  test:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          WORKER_COUNT: ${{ github.event.inputs.worker_count || '20' }}
        run: npx playwright test --workers=20

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload keyword report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyword-matches
          path: downloads/keyword-matches.json
          retention-days: 30
